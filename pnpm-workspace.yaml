packages:
  - '.'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: false
  unrs-resolver: false

# Patched transitive versions for advisories that only reach build and lint tooling (pnpm audit --prod is clean).
overrides:
  browserslist@<4.28.7: '>=4.28.7'
  fast-uri@<3.1.8: '>=3.1.8'
  'brace-expansion@>=4.0.0 <5.0.12': '>=5.0.12'
  'brace-expansion@<1.1.21': '1.1.21'
  'esbuild@<=0.24.2': '>=0.25.0'
