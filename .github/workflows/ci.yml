# SPDX-License-Identifier: AGPL-3.0-only
#
# GitHub Actions may be unavailable (for example when the account has a billing problem). This
# workflow is therefore a convenience copy, not the source of truth. The source of truth is
# scripts/ci/run.sh (run it with: pnpm ci:local). It performs the same checks in the same order
# and works on any machine with Docker, Node and pnpm. See docs/CI.md. When you change a check,
# change scripts/ci/run.sh first and mirror the change here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check:design
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          SERWIST_SUPPRESS_TURBOPACK_WARNING: '1'

  integration:
    name: Integration (ephemeral Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taka_sats
          POSTGRES_USER: taka_sats
          POSTGRES_PASSWORD: taka_sats
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taka_sats -d taka_sats"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://taka_sats:taka_sats@localhost:5432/taka_sats
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      # Database backed tests run in the integration job against a Postgres service.
      - run: pnpm test

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: app
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit carries Signed-off-by
        run: bash scripts/ci/check-dco.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  e2e:
    name: Playwright e2e (offline weigh flow)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taka_sats
          POSTGRES_USER: taka_sats
          POSTGRES_PASSWORD: taka_sats
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taka_sats -d taka_sats"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://taka_sats:taka_sats@localhost:5432/taka_sats
      AUTH_SECRET: e2e-ci-only-not-a-real-secret
      NEXT_TELEMETRY_DISABLED: '1'
      E2E: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  spdx:
    name: SPDX headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source files declare an SPDX licence
        run: bash scripts/ci/check-spdx.sh
