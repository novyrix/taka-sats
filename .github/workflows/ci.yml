# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  integration:
    name: Integration (ephemeral Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taka_sats
          POSTGRES_USER: taka_sats
          POSTGRES_PASSWORD: taka_sats
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taka_sats -d taka_sats"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://taka_sats:taka_sats@localhost:5432/taka_sats
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      # Integration test suites are added with the API routes from M1 onward.
      - run: pnpm test

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: app
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit carries Signed-off-by
        run: |
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git log -1 --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit $sha is missing a Signed-off-by trailer (DCO, D-16)"
              missing=1
            fi
          done < <(git rev-list "$range")
          exit $missing

  e2e:
    name: Playwright e2e (enabled at M3)
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "Scaffolded — enabled when the offline weigh flow lands (M3-11)."

  spdx:
    name: SPDX headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source files declare an SPDX licence
        run: |
          missing=0
          while read -r file; do
            case "$file" in
              *.d.ts) continue ;;
            esac
            if ! head -n 5 "$file" | grep -q 'SPDX-License-Identifier: AGPL-3.0-only'; then
              echo "::error file=$file::missing SPDX-License-Identifier header"
              missing=1
            fi
          done < <(git ls-files '*.ts' '*.tsx' '*.mts' '*.mjs' ':!:*.config.*' ':!:next-env.d.ts')
          exit $missing
