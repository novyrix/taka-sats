# The labels this project uses. Keep this file and the repository's labels in sync by hand
# (or with a label sync tool of your choice). Colours are hex without the leading #.
- name: bug
  color: d73a4a
  description: Something is not working
- name: feature
  color: 0e8a16
  description: A new capability
- name: documentation
  color: 0075ca
  description: Improvements or additions to documentation
- name: good first issue
  color: 7057ff
  description: A small, well described task for a new contributor
- name: help wanted
  color: 008672
  description: Maintainers would welcome a contribution
- name: translation
  color: fbca04
  description: Swahili, Sheng or other language strings
- name: accessibility
  color: 1d76db
  description: Screen readers, contrast, touch targets, keyboard use
- name: offline
  color: c5def5
  description: Offline capture, the outbox and sync
- name: payments
  color: b60205
  description: Payouts, wallet providers, the treasury vote. Two reviewers required
- name: ledger
  color: 5319e7
  description: The hash chain, checkpoints and verification
- name: security
  color: ee0701
  description: Security hardening (report vulnerabilities by email, not here)
- name: testing
  color: bfd4f2
  description: Tests, fixtures and test infrastructure
- name: console
  color: 0052cc
  description: The operator console
- name: field app
  color: 0052cc
  description: The supervisor PWA
- name: needs reproduction
  color: ededed
  description: Waiting for steps to reproduce the problem
