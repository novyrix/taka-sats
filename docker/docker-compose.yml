name: taka-sats

x-app-environment: &app-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: ${MINIO_BUCKET:?set MINIO_BUCKET}
  S3_REGION: auto
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  NOSTR_RELAY_URL: ws://relay:8080
  # Auth.js JWT signing secret (M2-1) — required for /api/auth/* to boot.
  AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
  # Lightning provider secrets (D-21 §13.1) — only the one matching
  # lightning.float_provider needs a real value; unused otherwise.
  BLINK_API_KEY: ${BLINK_API_KEY:-}
  LNBITS_ADMIN_KEY: ${LNBITS_ADMIN_KEY:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - minio-data:/data

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: app
    restart: unless-stopped
    environment: *app-environment
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, 'http://127.0.0.1:3000/']
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  relay:
    image: scsibug/nostr-rs-relay:0.9.0
    restart: unless-stopped
    ports:
      - '${NOSTR_RELAY_PORT:-8080}:8080'
    volumes:
      - ./nostr/config.toml:/usr/src/app/config.toml:ro
      - relay-data:/usr/src/app/db

  # One-off admin scripts (scripts/*.ts) — the `app`/`worker` images are
  # pruned production builds with no dev dependencies, so this reuses the
  # `builder` stage (full source + tsx) instead. Never started by `up`
  # (profile-gated); run explicitly, e.g.:
  #   docker compose --env-file .env run --rm tools scripts/create-supervisor.ts \
  #     --name "…" --phone "…" --role admin --password "…"
  tools:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: builder
    profiles: [tools]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [pnpm, exec, tsx]

volumes:
  postgres-data:
  minio-data:
  relay-data:
