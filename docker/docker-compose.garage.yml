# S3-compatible storage overlay for single-node self-hosted pilots.
#
# Garage is private to the Compose network. The loopback-only port is for
# operator diagnostics; photos are still served through the authenticated app.

services:
  minio:
    image: dxflrs/garage:v2.3.0
    command: /garage server --single-node --default-bucket
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY:?set GARAGE_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY:?set GARAGE_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_BUCKET:-taka-sats}
    ports: !override
      - '${GARAGE_S3_PORT:-127.0.0.1:9100}:3900'
    volumes: !override
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: [CMD, /garage, status]
      interval: 5s
      timeout: 5s
      retries: 24

  app:
    environment:
      S3_ENDPOINT: http://minio:3900
      S3_BUCKET: ${GARAGE_BUCKET:-taka-sats}
      S3_REGION: garage
      S3_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY:?set GARAGE_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${GARAGE_SECRET_KEY:?set GARAGE_SECRET_KEY}

  worker:
    environment:
      S3_ENDPOINT: http://minio:3900
      S3_BUCKET: ${GARAGE_BUCKET:-taka-sats}
      S3_REGION: garage
      S3_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY:?set GARAGE_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${GARAGE_SECRET_KEY:?set GARAGE_SECRET_KEY}

  tools:
    environment:
      S3_ENDPOINT: http://minio:3900
      S3_BUCKET: ${GARAGE_BUCKET:-taka-sats}
      S3_REGION: garage
      S3_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY:?set GARAGE_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${GARAGE_SECRET_KEY:?set GARAGE_SECRET_KEY}

volumes:
  garage-meta:
  garage-data:
