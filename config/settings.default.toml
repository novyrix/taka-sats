# Taka Sats — default settings (REQUIREMENTS §13.2)
#
# This file is committed and holds every tunable with a documented default.
# Operators override values in a git-ignored `config/settings.toml` (only the
# keys they change) or via `TAKASATS__SECTION__KEY` environment variables.
# The merged result is Zod-validated at boot (`lib/config/`); an invalid or
# out-of-range value stops the process. See `docs/CONFIGURATION.md`.
#
# SECRETS DO NOT BELONG HERE. Database URL, provider API keys, the LNbits admin
# key, the Nostr private key, and object-storage credentials are environment
# variables only. This file may name *which* provider, never a key.

[programme]
name           = "Taka Sats by Afribit Africa"
timezone       = "Africa/Nairobi"        # IANA name; drives session windows and reporting
fiat_currency  = "KES"                   # ISO 4217; the rate table and all reporting use this
locales        = ["en", "sw", "sheng"]   # first-class UI locales
default_locale = "en"                    # must be one of `locales`
public_base_url = "https://taka.afribit.africa"  # where this deployment is served (no trailing slash); builds credential URLs

[custody]
# 'byo'         = collector brings their own wallet (Blink Paycode / Lightning Address).
#                 This is the shipped, non-custodial default (D-05).
# 'provisioned' = server mints an LNbits wallet per collector (custodial — needs gate G1).
default_address_source = "byo"
provisioning_enabled   = false           # must be explicitly true to allow 'provisioned'
# When enabling provisioning, paste the exact G1 acknowledgement string from
# `lib/config/schema.ts` (PROVISIONING_ACKNOWLEDGEMENT). It is a deliberate
# acknowledgement that the recorded legal review exists — not legal cover.
provisioning_ack       = ""

[collectors]
# The authorization gate (D-25, ADR-0017). true  = a supervisor's registration is `pending`
# until a hub_lead/admin authorizes it; only authorized collectors can be weighed, issued an
# NFC tag, or paid. false = every registration is `active` at once (no gate).
authorization_required = true
code_prefix            = "TS"            # first segment of a collector's public code: TS-KBR-0042
default_site_code      = ""              # site segment when an enrolment names none ("" = omit it)

[auth]
# How long a signed-in supervisor session survives, including fully offline
# (§3.1, ADR-0002) — a JWT session, not a server-side lookup, so this is the
# only place the duration is decided. Balance re-auth friction in the field
# against a lost/stolen-device window (see docs/THREAT_MODEL.md T6/R1).
session_max_age_days = 30

[lightning]
float_provider = "blink"                 # blink | lnbits | fedimint | fake — the operating-float rail. "fake" is a DEMO rail that pays nothing; the app refuses it in production unless TAKASATS_ALLOW_FAKE_PROVIDER=true
# Hosts whose URLs are spend credentials (e.g. the Pay side of a Paybee card). A scanned code on
# one of these hosts (or a subdomain, case-insensitive) is rejected before any network call and
# is never stored, logged, or converted into a receive address.
spend_link_hosts = ["card.paybee.buzz"]
provider_timeout_ms = 30000              # per-request timeout talking to the wallet provider (Blink/LNbits). A timeout on a payment means the outcome is UNKNOWN (held for a person), never "failed" (1000..120000)
lnurl_timeout_ms = 8000                  # per-request timeout when resolving an LNURL / requesting an invoice (1000..60000)

# Wallet-provider label by Lightning-address domain (subdomains match). Display/analytics
# only — no behaviour depends on it, so a new wallet provider needs no code change (ADR-0018).
[lightning.provider_hints]
"flow.paybee.buzz" = "paybee"
"blink.sv"         = "blink"
"fedi.xyz"         = "fedi"

[lightning.blink]
api_url         = "https://api.blink.sv/graphql"
float_wallet_id = ""                     # non-secret wallet id; the API key is an env var

[lightning.lnbits]
base_url        = "http://lnbits:5000"
float_wallet_id = ""                     # non-secret wallet id; the admin key is an env var

[lightning.fedimint]
federation_invite = ""                   # Afribit's federation invite code (fedi.xyz)

[money]
rate_staleness_ttl_seconds   = 900       # a payout will not run against a BTC rate older than this (D-18)
exchange_sources             = ["yadio", "coinbase", "kraken_fx"]  # >=2 must answer; known: yadio | coinbase | kraken_fx | coingecko | fake
rate_deviation_tolerance_pct = 10        # sources within this % of the median agree; an outlier is set aside; >=2 must agree within this % of each other

[rates]
# Seed values for `material_rates` on the first migration only. Afterwards the
# admin UI writes new versioned rows (FR-2.2). Units: fiat minor (KES cents) per kg.
seed = [
  { material = "PET",       rate_fiat_minor_per_kg = 2000 },
  { material = "HDPE",      rate_fiat_minor_per_kg = 1500 },
  { material = "aluminium", rate_fiat_minor_per_kg = 8000 },
]

[payouts]
second_signoff_threshold_sats = 50000    # a payout ABOVE this is held until a distinct approver signs off (FR-3.2). 0 holds EVERY payout for review
require_approval_first_payout = true     # the first payout to any new destination also needs an approver, whatever its size
float_low_balance_alert_sats  = 200000    # the worker alerts admin below this (FR-7.2)
auto_topup_enabled            = false
sweep_cron                    = "*/5 * * * *" # how often the worker re-tries payouts parked on a missing rate / destination / float (5-field cron, UTC)
sending_stale_minutes         = 10       # a payout stuck in 'sending' this long is flagged payout_uncertain for an admin — it is NEVER re-sent automatically
max_attempts                  = 8        # process-payout job retries (backoff) before the job gives up; the payout stays parked for the sweeper

[treasury]
# The pool-to-hot-wallet funding vote (ADR-0020). Taka Sats only records the vote; the transfer is signed in the pool's own wallet.
topup_approvals_required = 2             # distinct stewards who must approve a refill, never counting the proposer (so 2 needs 3 stewards in all)
hot_wallet_cap_sats      = 0             # a proposal that would take the hot wallet above this (float + funding in flight + amount) is refused. 0 = no cap

[reconciliation]
variance_tolerance_pct = 5               # paid-kg vs sold-kg variance above this is flagged (FR-3.5)

[anomaly]
identical_weight_repeat_count = 4         # N identical weights from one supervisor -> flag
payout_concentration_gini     = 0.6       # payout skew above this over a session -> flag
off_hours_grace_minutes       = 30        # events this far outside a session window -> flag
weight_outlier_min_events      = 20        # a material needs this many prior events before weight outliers are flagged
weight_outlier_mad_k          = 6         # flag a weight further than k x (scaled MAD) from the material's median

[scheduling]
coverage_gap_lead_time_hours = 12        # an unstaffed session within this window -> admin alert (FR-6.2)

[transparency]
amount_disclosure        = "bucketed"    # exact | bucketed | omitted (OQ-3)
weight_bucket_kg         = 0.5           # bucket size for attestations and public figures
public_map_jitter_metres = 50           # location fuzzing for public:read map points
nostr_relays             = ["wss://relay.damus.io", "wss://nos.lol"]

[ledger]
checkpoint_enabled          = true       # run the checkpoint-signing job (needs the LEDGER_SIGNING_KEY secret)
checkpoint_cron             = "0 * * * *" # how often the worker looks for new entries to checkpoint (UTC)
checkpoint_interval_entries = 500        # sign a checkpoint once >= N new entries exist since the last (§11.2)
opentimestamps_enabled      = true       # also anchor checkpoints with OpenTimestamps
